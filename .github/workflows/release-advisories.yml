name: Release advisories

on:
  push:
    branches: [main]
    paths: [release-advisories.json]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate announcement data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate notices against the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh api repos/oblien/openship/releases/latest --jq .tag_name)"
          # A normal version-bump commit stages its future notice with runtime code.
          # Readers retain the published notice until that version actually exists.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$(git diff --name-only HEAD^ HEAD)" != "release-advisories.json" ]; then
            latest_tag="$(bun -p 'require("./apps/api/package.json").version')"
          fi
          bun scripts/check-release-advisories.ts "$latest_tag"
          bun test scripts/check-release-advisories.test.ts
